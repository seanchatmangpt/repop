# cgap-popcorn-aoq gate witness court (ggen.semantic-gate-witness-court/1).
# Executable arm: qualification/verify.py — for every gate stem in gates/
# (the directory listing is the truth), pass witness must give 0 violation
# rows and fail witness must give >=1 (court flip; a 0-flip gate is
# VACUOUS-GATE, never a pass).
[court]
schema = "ggen.semantic-gate-witness-court/1"
case_key = "exact-stem"
runner = "python3 qualification/verify.py"
gate_dir = "gates"
pass_dir = "witnesses/pass"
fail_dir = "witnesses/fail"
require_pass = true
require_fail = true
